# Every push and pull request: the verification suite, the API tests, and a
# lint + type-check + production build of the React front end.
#
# The runner has the repository only. The FLUID dataset (18 GB), the detector
# weights and the source videos are not in it, so verify_system.py runs with
# --ci and reports the checks that need them as SKIP; the API tests skip the
# same ones themselves. Everything computed from the committed metrics CSVs -
# the signal plan, alerts, forecasts and every REPORT.md figure that derives
# from them - is checked in full.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (slim set - no torch)
        run: pip install -r requirements.txt
      - name: Verification suite
        run: python tests/verify_system.py --ci
      - name: API tests
        run: python -m pytest tests/test_api.py -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
