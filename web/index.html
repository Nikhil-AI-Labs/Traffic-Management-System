<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Surat Traffic Intelligence — lane density, adaptive signal timing, bottleneck detection and forecasting from city CCTV. E-Rakshak Hackathon 2026, PS-08." />
    <title>Surat Traffic Intelligence</title>
    <script>
      // Apply the saved theme before first paint, so a dark-mode viewer never
      // sees a white flash while the app boots.
      try {
        var t = localStorage.getItem('sti-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
